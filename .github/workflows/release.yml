name: Release

# Push a tag such as v0.1.0 to test and create a GitHub release.
# To publish to pub.dev: remove "publish_to: none" from pubspec.yaml, enable automated publishing
# for this repository on pub.dev, then uncomment the last step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run || true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      # - run: dart pub publish --force

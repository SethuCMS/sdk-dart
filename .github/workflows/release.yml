name: Release

# Push a tag such as v0.1.1 (it must match the version in pubspec.yaml) to test,
# publish to pub.dev and create a GitHub release.
# pub.dev trusts this workflow through automated publishing (package Admin tab):
# repository SethuCMS/sdk-dart, tag pattern v{{version}}. No secrets are stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run
      - run: dart pub publish --force
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
